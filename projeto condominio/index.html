<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/style.css">
   <title>Gs Interactive | Condominio do residencial Morada sul</title>
</head>
<body class="pagina-login">
   <header>
     <figure id="cabecalho">
      <img src="img/morada_sul-removebg-preview.png" alt="logo">
      
     </figure>
      <h1>Residencial Morada Sul</h1>
   </header>
   <main id="container-login">
      
      <h2>Acesso ao Sistema</h2>
      <form action="login" id="formulario">
         <section class="formulario-de-entrada">
            <label for="selecionarUsuario">Porteiro :</label>
            <select name="selecionarUsuario" id="selecionarUsuario">
               <option value="">Selecionar o Colaborador</option>
               <option value="jose guilherme">José Guilherme</option>
               <option value="milton mendes">Milton Mendes</option>
               <option value="Heleno">Heleno</option>
               <option value="damião">Damião</option>
            </select>
         </section>
         <button type="submit" class="btn">Entrar</button>
      </form>
   </main>
   <footer>
      <img src="img/logo-footer-removebg-preview.png" alt="logo-footer">
   </footer>

   
</body>
</html>
